<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satisfactory Live Map</title>
    <style>
      html, body, #map { height: 100%; margin: 0; background: #1b1d22; }
      #status { position: absolute; bottom: 8px; left: 8px; z-index: 1000;
        font: 12px system-ui; color: #ddd; background: #000a; padding: 4px 8px; border-radius: 4px; }
      #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000;
        min-width: 200px; font: 14px system-ui; color: #ddd; background: #000c; padding: 12px 16px;
        border-radius: 6px; text-align: center; pointer-events: none; }
      #loading[hidden] { display: none; }
      #loading .bar { margin-top: 8px; height: 4px; background: #fff2; border-radius: 2px; overflow: hidden; }
      #loading .bar > div { height: 100%; width: 0; background: #f90; transition: width 0.15s; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="status">connecting…</div>
    <div id="loading" hidden><span>Loading map…</span><div class="bar"><div></div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
